<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SemanticSearch test</title>
    <style>
      body { font: 13px -apple-system, sans-serif; margin: 0; padding: env(safe-area-inset-top) 12px 12px; }
      button { font-size: 15px; margin: 8px 8px 8px 0; }
      pre { white-space: pre-wrap; word-break: break-word; }
    </style>
  </head>
  <body>
    <h3>SemanticSearch validation</h3>
    <button id="run">Run next phase</button>
    <button id="reset">Reset</button>
    <pre id="out"></pre>
    <script>
      window.onerror = (m, src, line) => {
        document.getElementById('out').textContent += `FAIL script error | ${m} (${src}:${line})\n`;
      };
    </script>
    <script src="js/capacitor.js"></script>
    <script src="js/plugin.js"></script>
    <script src="js/data.js"></script>
    <script src="js/bench.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
